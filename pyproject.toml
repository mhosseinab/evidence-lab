[tool.uv.workspace]
members = ["apps/evidence-lab"]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.10"]

[tool.pytest.ini_options]
testpaths = ["apps/evidence-lab/tests"]
asyncio_mode = "auto"
markers = ["integration: requires PostgreSQL with pgvector", "native_postgres: requires native PostgreSQL concurrency semantics"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["apps/evidence-lab/src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
