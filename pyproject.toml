[tool.uv.workspace]
members = ["apps/evidence-lab"]

[dependency-groups]
dev = [
    "basedpyright==1.40.2",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["apps/evidence-lab/tests"]
asyncio_mode = "auto"
markers = ["integration: requires PostgreSQL with pgvector", "native_postgres: requires native PostgreSQL concurrency semantics"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["apps/evidence-lab/src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.basedpyright]
include = ["apps/evidence-lab/src", "apps/evidence-lab/tests", "tooling"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
