[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-verification-poc"
version = "0.1.0"
description = "Provider-agnostic document retrieval and evidence-gated answers"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.142.2", "uvicorn==0.54.0", "pydantic==2.13.5",
  "httpx==0.28.1", "PyYAML==6.0.3", "psycopg[binary]==3.3.6",
  "alembic==1.20.0", "SQLAlchemy==2.1.3", "pypdf==6.19.0", "python-multipart==0.0.32",
  "numpy==2.5.3",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.10"]

[project.scripts]
rag-poc = "rag_poc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rag_poc = ["static/*", "migrations/*.py", "migrations/versions/*.py"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc", "**/*.pyo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = ["integration: requires PostgreSQL with pgvector", "native_postgres: requires native PostgreSQL concurrency semantics"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
